
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Hell4uk
          outputs: |
            output/github-snake.svg?palette=github
            output/github-snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Commit generated files
        uses: EndBug/add-and-commit@v9
        with:
          add: output/
          message: "chore: update contribution snake"
