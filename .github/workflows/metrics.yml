
name: Update GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate terminal metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Hell4uk
          template: terminal
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: Generate yearly contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Hell4uk
          template: classic
          filename: metrics-calendar.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1

      - name: Generate isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Hell4uk
          template: terminal
          filename: metrics-isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
